{% if can_reregister %}
<form method="post" action="{% url 'register' activity.pk %}" class="inline-form">
  {% csrf_token %}{% if return_to %}<input type="hidden" name="return_to" value="{{ return_to }}">{% endif %}<button>Reinscribirme</button>
</form>
{% else %}
<p>{{ reregistration_message }}</p>
{% endif %}
